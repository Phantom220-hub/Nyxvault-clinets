name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce offline-only runtime
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'HTTPRequest|HTTPClient|WebSocketPeer|WebSocketMultiplayerPeer|MultiplayerAPI|PacketPeer|ENetMultiplayerPeer|https?://' scripts scenes project.godot; then
            echo "Network API or remote URL found in runtime files. DreamHouse 3D must remain offline-first."
            exit 1
          fi
          grep -q '^permissions/internet=false$' export_presets.cfg
          echo "Offline policy scan passed; Android INTERNET permission is disabled."

      - name: Install Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Configure Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.1" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Validate project and import resources
        run: |
          godot --version
          godot --headless --editor --path . --quit

      - name: Run geometry tests
        run: godot --headless --path . --script tests/test_geometry.gd

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/DreamHouse3D-debug.apk
          test -s build/DreamHouse3D-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DreamHouse3D-debug-apk
          path: build/DreamHouse3D-debug.apk
          if-no-files-found: error
          retention-days: 14
